<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>AI English Poem Generator</h1>
    </header>
    <main>
      <form>
        <input
          type="text"
          placeholder="Enter english topic of choice "
          autofocus="off"
          required
        />
        <input type="submit" />
      </form>
      <div>
        Somehow the world leaned closer to me
        <br />
        and I leaned back, without fear.
      </div>
    </main>
    <footer>
      This was created by
      <a href=" https://github.com/Ivymumbi" target="_blank">Ivy Mumbi</a> and
      is<a href="https://github.com/Ivymumbi/AI-Poem-generator" target="_blank">
        open sourced on Github</a
      >
      and hosted on
      <a href="https://apoemgenerator.netlify.app/" target="_blank"> Netlify</a>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
