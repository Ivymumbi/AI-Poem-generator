<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI English Poem Generator</h1>
      </header>
      <main>
        <form id="form">
          <input
            type="text"
            placeholder="Enter english topic of choice eg.love "
            autofocus
            required
            autocomplete="off"
            class="instructions"
            id="user-instructions"
          />
          <input type="submit" class="submit-btn" />
        </form>
        <div class="poem hidden" id="poem"></div>
      </main>
      <footer>
        This was created by
        <a href=" https://github.com/Ivymumbi" target="_blank">Ivy Mumbi</a> and
        is<a
          href="https://github.com/Ivymumbi/AI-Poem-generator"
          target="_blank"
        >
          open sourced on Github</a
        >
        and hosted on
        <a href="https://apoemgenerator.netlify.app/" target="_blank">
          Netlify</a
        >
      </footer>
      <script src="app.js"></script>
    </div>
  </body>
</html>
